<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudyHub Local</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #202124;
        background: #f7f7f5;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(520px, calc(100% - 48px)); }
      .mark { width: 44px; height: 44px; display: grid; place-items: center; background: #bd161d; color: white; font-weight: 750; font-size: 20px; border-radius: 8px; }
      h1 { margin: 22px 0 10px; font-size: 28px; letter-spacing: 0; }
      p { margin: 0; color: #5f6368; font-size: 16px; line-height: 1.55; }
      .actions { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
      button { min-height: 42px; padding: 0 16px; border: 1px solid #c9c9c4; border-radius: 6px; background: white; color: #202124; font: inherit; font-weight: 650; cursor: pointer; }
      button.primary { background: #bd161d; border-color: #bd161d; color: white; }
      button:disabled { opacity: .55; cursor: wait; }
      #status { margin-top: 18px; min-height: 24px; font-size: 14px; }
      textarea { position: fixed; left: -9999px; width: 1px; height: 1px; }
    </style>
    <script src="fallback.js" defer></script>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">S</div>
      <h1>StudyHub could not start its local service.</h1>
      <p>Your study files have not been changed. You can retry once or copy privacy-safe diagnostics for support.</p>
      <div class="actions">
        <button class="primary" id="retryButton" type="button">Retry</button>
        <button id="copyButton" type="button">Copy Diagnostics</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <textarea id="diagnostics" aria-hidden="true" tabindex="-1"></textarea>
    </main>
  </body>
</html>
