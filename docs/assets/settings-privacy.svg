  <rect x="52" y="170" width="560" height="430" rx="8" fill="#ffffff" stroke="#dbe3ed"/>
  <text x="82" y="212" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#26313d">Local Library</text>
