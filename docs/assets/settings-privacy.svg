  <text x="728" y="458" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f7a62">Safe public demo</text>
  <text x="728" y="480" font-family="Inter, Arial, sans-serif" font-size="13" fill="#506070">No API keys, local usernames, private paths, or real course data.</text>
